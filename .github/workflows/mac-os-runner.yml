name: Compress H265 Single File (macOS 15)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mega_url:
        description: 'URL File MEGA (Direct File Link)'
        required: false
        default: 'https://mega.nz/file/CrJiCI6B#m2ya_j0gkyz0_704PAdDki1nGQHGAuLkVQPlaYvJN-A'
      ffmpeg_url:
        description: 'URL Direct Download ffmpeg binary (macOS)'
        required: false

env:
  DEFAULT_FFMPEG_URL: 'https://github.com/scottluxe256-hub/ffmpeg-builder/releases/download/9.0.2/ffmpeg'
  DEFAULT_MEGA_URL: 'https://mega.nz/file/CrJiCI6B#m2ya_j0gkyz0_704PAdDki1nGQHGAuLkVQPlaYvJN-A'

jobs:
  compress-h265-macos:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Folders & Install Tools
        run: |
          mkdir -p raw_videos
          mkdir -p compressed_videos
          brew install megatools || true

      - name: Download Custom macOS ffmpeg
        run: |
          URL="${{ github.event.inputs.ffmpeg_url }}"
          if [ -z "$URL" ]; then
            URL="${{ env.DEFAULT_FFMPEG_URL }}"
          fi
          echo "Downloading FFmpeg from: $URL"
          curl -L "$URL" -o ffmpeg
          chmod +x ffmpeg

      - name: Download File dari MEGA
        run: |
          MEGA_LINK="${{ github.event.inputs.mega_url }}"
          if [ -z "$MEGA_LINK" ]; then
            MEGA_LINK="${{ env.DEFAULT_MEGA_URL }}"
          fi

          # Konversi /file/ID#KEY menjadi /#!ID!KEY
          OLD_MEGA_LINK=$(echo "$MEGA_LINK" | sed -E 's|/file/([^#]+)#|/#!\1!|')

          echo "Mengunduh dari: $OLD_MEGA_LINK"

          megatools dl "$OLD_MEGA_LINK" --path raw_videos || {
            echo "⚠️ Megatools gagal, mencoba fallback via Python mega.py..."
            python3 -m pip install mega.py --break-system-packages
            python3 -c "from mega import Mega; m = Mega().login(); m.download_url('$OLD_MEGA_LINK', dest_path='raw_videos')"
          }

          echo "Isi folder raw_videos:"
          ls -la raw_videos

      - name: Proses Kompresi H.265 (macOS - Auto Color Range)
        run: |
          INPUT=$(find raw_videos -type f | head -n 1)

          if [ -z "$INPUT" ]; then
            echo "❌ Tidak ada video yang ditemukan!"
            exit 1
          fi

          FILENAME=$(basename "$INPUT")
          OUTPUT="compressed_videos/${FILENAME%.*}_H265_AutoColor.mp4"

          echo "🚀 Memproses kompresi H.265 di macOS 15: $FILENAME"

          ./ffmpeg -nostdin \
            -i "$INPUT" \
            -r 60 \
            -c:v libx265 -preset slow -crf 26 -profile:v main -pix_fmt yuv420p \
            -g 120 -keyint_min 30 \
            -x265-params "level-idc=4.1:ref=5:bframes=5:aq-mode=3:aq-strength=0.9:qg-size=16:psy-rd=1.6:psy-rdoq=1.0:rdoq-level=2:deblock=-1,-1:rc-lookahead=60:me=umh:merange=24:subme=4:wpp=1:no-sao=1:colorprim=bt709:transfer=bt709:colormatrix=bt709" \
            -sws_flags spline+accurate_rnd \
            -vf "fps=fps=60:round=near,setpts=N/60/TB,scale='if(gt(iw,ih),-2,1080)':'if(gt(iw,ih),1080,-2)':flags=spline+accurate_rnd+full_chroma_int+full_chroma_inp" \
            -colorspace bt709 -color_primaries bt709 -color_trc bt709 \
            -c:a libfdk_aac -profile:a aac_low -b:a 128k \
            -shortest \
            -video_track_timescale 60000 -tag:v hvc1 \
            -metadata title="TikTok 8Bit Safe Color H265 Auto Range" \
            -movflags +faststart -y "$OUTPUT"

          echo "✅ Selesai: $OUTPUT"
          ls -lh compressed_videos/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Kompres-H265-macOS
          path: compressed_videos/
          retention-days: 7
          
