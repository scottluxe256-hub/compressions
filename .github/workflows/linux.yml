name: Compress H265 Single File (Ubuntu)

on:
  workflow_dispatch:
    inputs:
      gdrive_url:
        description: 'URL File Google Drive (Pastikan akses: Anyone with the link)'
        required: true
      resolution:
        description: 'Resolusi Sisi Pendek (1:1 / Portrait / Landscape)'
        required: true
        default: '896'
        type: choice
        options:
          - '720'
          - '896'
          - '1080'
      ffmpeg_url:
        description: 'URL Direct Download ffmpeg binary'
        required: false

env:
  DEFAULT_FFMPEG_URL: 'https://github.com/scottluxe256-hub/compressions/releases/download/9.0.2/ffmpeg'

jobs:
  compress-h265-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Folders & Install Tools
        run: |
          mkdir -p raw_videos compressed_videos
          pip install -q gdown

      - name: Download Custom Linux ffmpeg
        run: |
          URL="${{ github.event.inputs.ffmpeg_url }}"
          if [ -z "$URL" ]; then
            URL="${{ env.DEFAULT_FFMPEG_URL }}"
          fi
          echo "Downloading FFmpeg from: $URL"
          curl -L "$URL" -o ffmpeg
          chmod +x ffmpeg

      - name: Download File dari Google Drive
        run: |
          GDRIVE_LINK="${{ github.event.inputs.gdrive_url }}"
          echo "Mengunduh dari Google Drive: $GDRIVE_LINK"

          gdown "$GDRIVE_LINK" -O raw_videos/

          echo "Isi folder raw_videos:"
          ls -lh raw_videos

      - name: Proses Kompresi H.265 (Ubuntu - 120fps to 60fps Smooth & Original Color)
        run: |
          INPUT=$(find raw_videos -type f | head -n 1)

          if [ -z "$INPUT" ]; then
            echo "❌ Tidak ada video yang ditemukan!"
            exit 1
          fi

          RES="${{ github.event.inputs.resolution }}"
          if [ -z "$RES" ]; then
            RES="896"
          fi

          FILENAME=$(basename "$INPUT")
          OUTPUT="compressed_videos/${FILENAME%.*}_${RES}p_H265.mp4"

          echo "🚀 Memproses kompresi H.265 (${RES}p - 120fps to 60fps Smooth & Warna Original 1:1): $FILENAME"

          ./ffmpeg -nostdin \
          -i "$INPUT" \
          -c:v libx265 -preset slow -crf 22 -profile:v main -level:v 4.1 -pix_fmt yuv420p \
          -g 120 -keyint_min 30 \
          -x265-params "ref=5:bframes=5:aq-mode=3:aq-strength=0.8:qg-size=32:psy-rd=1.5:psy-rdoq=1.0:rdoq-level=2:deblock=-1,-1:rc-lookahead=60:me=umh:merange=24:subme=4:wpp=1:frame-threads=0:pools=+:no-sao=1:colorprim=bt709:transfer=bt709:colormatrix=bt709" \
          -sws_flags spline+accurate_rnd \
          -vf "scale='if(gt(iw,ih),-2,${RES})':'if(gt(iw,ih),${RES},-2)':flags=spline+accurate_rnd+full_chroma_int+full_chroma_inp,minterpolate=fps=120:mi_mode=mci:mc_mode=aobmc:me_mode=bidir:vsbmc=1:scd=fdiff:scd_threshold=10,tmix=frames=2:weights='1 24',fps=fps=60:round=near,setpts=N/60/TB" \
          -colorspace bt709 -color_primaries bt709 -color_trc bt709 \
          -c:a copy \
          -shortest \
          -video_track_timescale 60000 -tag:v hvc1 \
          -metadata title="H265 Original Color Smooth 60fps" \
          -movflags +faststart -y "$OUTPUT"

          echo "✅ Selesai: $OUTPUT"
          ls -lh compressed_videos/

      - name: Upload Hasil ke GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compressed-video-h265
          path: compressed_videos/*.mp4
          retention-days: 7
          
