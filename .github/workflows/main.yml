name: Batch Video Compression (Native FFmpeg Ubuntu)

on:
  workflow_dispatch:

jobs:
  batch-compress-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg, Zip, & gdown
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip
          pip install gdown

      - name: Cek Versi FFmpeg Bawaan
        run: ffmpeg -version

      - name: Download Folder dari Google Drive
        run: |
          echo "Mengunduh semua video dari folder Google Drive..."
          gdown --folder "https://drive.google.com/drive/folders/1iARFOKWrSEjslCaNvqu_hdT8oSJMimcT" -O raw_videos/

      - name: Proses Kompresi Batch dengan FFmpeg
        run: |
          mkdir -p compressed_videos

          # Tampilkan struktur folder hasil download untuk memastikan filenya ada
          echo "=== Struktur Folder raw_videos ==="
          ls -R raw_videos

          # Cari semua file video secara rekursif (aman untuk nama file dengan spasi)
          find raw_videos -type f \( -iname "*.mp4" -o -iname "*.mov" -o -iname "*.mkv" -o -iname "*.avi" \) -print0 | while IFS= read -r -d '' file; do
            filename=$(basename "$file")
            echo "=================================================="
            echo "Memproses Video: $filename"
            echo "Path Asli: $file"
            echo "=================================================="

            ffmpeg -i "$file" \
              -c:v libx265 -preset slow -crf 18 -profile:v main -pix_fmt yuv420p \
              -g 120 -keyint_min 30 \
              -x265-params "ref=5:bframes=5:aq-mode=2:aq-strength=1.0:qg-size=16:psy-rd=1.0:psy-rdoq=1.0:rdoq-level=2:deblock=-1,-1:rc-lookahead=60:me=umh:merange=24:subme=8:wpp=1:no-sao=1:colorprim=bt709:transfer=bt709:colormatrix=bt709:range=limited" \
              -sws_flags spline+accurate_rnd \
              -vf "fps=60,setpts=N/(60*TB),hqdn3d=1.0:1.0:4:4,scale='if(gt(iw,ih),-2,1080)':'if(gt(iw,ih),1080,-2)':flags=spline+accurate_rnd+full_chroma_int+full_chroma_inp,colorspace=all=bt709:range=tv" \
              -c:a copy \
              -video_track_timescale 60000 -tag:v hvc1 -metadata title="TikTok 8Bit Safe Color H265" \
              -movflags +faststart -shortest -y "compressed_videos/${filename%.*}_H265.mp4"
          done

      - name: Kumpulkan Hasil ke File ZIP
        run: |
          echo "Membuat file ZIP hasil kompresi..."
          zip -r Hasil_Kompresi_Videos.zip compressed_videos/

      - name: Upload Artifact ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Kompresi-Batch
          path: Hasil_Kompresi_Videos.zip
          retention-days: 7
