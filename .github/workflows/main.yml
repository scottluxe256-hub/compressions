name: Compress H264 (Windows + MEGA)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mega_url:
        description: 'URL Direct MEGA File'
        required: false
        default: 'https://mega.nz/file/X7pRnQYR#B3jxU-J5KoVHoppg8SqmqtQXQUs6426PlalCd9DCtJA'
      ffmpeg_url:
        description: 'URL Direct Download ffmpeg.exe'
        required: false

env:
  DEFAULT_FFMPEG_URL: 'https://github.com/scottluxe256-hub/compressions/releases/download/9.0.1/ffmpeg.exe'
  DEFAULT_MEGA_URL: 'https://mega.nz/file/X7pRnQYR#B3jxU-J5KoVHoppg8SqmqtQXQUs6426PlalCd9DCtJA'

jobs:
  compress-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Megatools via Chocolatey
        run: |
          choco install megatools -y
          mkdir -p raw_videos

      - name: Download Custom ffmpeg.exe
        run: |
          URL="${{ github.event.inputs.ffmpeg_url }}"
          if [ -z "$URL" ]; then
            URL="${{ env.DEFAULT_FFMPEG_URL }}"
          fi
          curl -L "$URL" -o ffmpeg.exe

      - name: Download Video dari MEGA
        run: |
          MEGA_LINK="${{ github.event.inputs.mega_url }}"
          if [ -z "$MEGA_LINK" ]; then
            MEGA_LINK="${{ env.DEFAULT_MEGA_URL }}"
          fi
          megatools dl "$MEGA_LINK" --path raw_videos/

      - name: Proses Kompresi H264
        run: |
          mkdir -p compressed_videos

          INPUT=$(find raw_videos -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.mov" \) | head -n 1)

          if [ -z "$INPUT" ]; then
            echo "❌ Tidak ada file video yang ditemukan di raw_videos!"
            exit 1
          fi

          FILENAME=$(basename "$INPUT")
          OUTPUT="compressed_videos/${FILENAME%.*}_H264.mp4"

          echo "🚀 Memproses kompresi H264: $FILENAME"

          ./ffmpeg.exe -nostdin -i "$INPUT" \
            -vf "setpts=N/(60*TB),hqdn3d=1.0:1.0:4:4,scale='if(gt(iw,ih),-2,720)':'if(gt(iw,ih),720,-2)':flags=spline+accurate_rnd+full_chroma_int+full_chroma_inp" \
            -af "aresample=async=1000" \
            -c:v libx264 -preset slower -crf 24 -r 60 -profile:v high -pix_fmt yuv420p \
            -g 120 -keyint_min 30 \
            -x264-params "ref=8:bframes=8:aq-mode=2:aq-strength=1.0:psy-rd=1.0,1.0:trellis=2:deblock=-1,-1:rc-lookahead=60:me=umh:merange=24:subme=8:colorprim=bt709:transfer=bt709:colormatrix=bt709:fullrange=off" \
            -sws_flags spline+accurate_rnd \
            -c:a libfdk_aac -profile:a aac_he -b:a 64k \
            -video_track_timescale 60000 -metadata title="TikTok 8Bit Safe Color H264" \
            -movflags +faststart -y "$OUTPUT"

          echo "✅ Selesai: $OUTPUT"
          ls -lh compressed_videos/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Kompres-H264
          path: compressed_videos/
          retention-days: 7
          
