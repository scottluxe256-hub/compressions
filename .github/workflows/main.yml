name: Batch Parallel Compress H265 (Windows + MEGA)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mega_url:
        description: 'URL Direct MEGA Folder (Berisi banyak video .mp4)'
        required: false
        default: 'https://mega.nz/folder/P6JElAxI#fbMvsXBK7sRV1wv_X6C57Q'
      ffmpeg_url:
        description: 'URL Direct Download ffmpeg.exe Custom Kamu'
        required: false

env:
  DEFAULT_FFMPEG_URL: 'https://github.com/scottluxe256-hub/compressions/releases/download/9.0.1/ffmpeg.exe'
  DEFAULT_MEGA_URL: 'https://mega.nz/folder/P6JElAxI#fbMvsXBK7sRV1wv_X6C57Q'

jobs:
  batch-compress-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Megatools via Chocolatey
        run: |
          choco install megatools -y
          mkdir -p raw_videos

      - name: Download Custom ffmpeg.exe
        run: |
          URL="${{ github.event.inputs.ffmpeg_url }}"
          if [ -z "$URL" ]; then
            URL="${{ env.DEFAULT_FFMPEG_URL }}"
          fi
          echo "Mengunduh ffmpeg.exe kustom dari: $URL"
          curl -L "$URL" -o ffmpeg.exe

      - name: Restore Cache Folder Compressed Videos
        uses: actions/cache@v4
        with:
          path: compressed_videos
          key: batch-cache-${{ runner.os }}-${{ hashFiles('raw_videos/**') }}
          restore-keys: |
            batch-cache-${{ runner.os }}-

      - name: Download Video dari MEGA
        run: |
          MEGA_LINK="${{ github.event.inputs.mega_url }}"
          if [ -z "$MEGA_LINK" ]; then
            MEGA_LINK="${{ env.DEFAULT_MEGA_URL }}"
          fi
          echo "Mengunduh file/folder dari MEGA: $MEGA_LINK"
          megatools dl "$MEGA_LINK" --path raw_videos/
          
          echo "=== Cek isi folder raw_videos setelah download ==="
          find raw_videos -type f

      - name: Proses Batch & Kompresi Paralel H265 (CRF 24)
        run: |
          mkdir -p compressed_videos
          
          # Membuat script kecil untuk menangani satu video
          # Script ini nanti akan dipanggil berkali-kali secara paralel
          cat << 'EOF' > compress_single.sh
          #!/bin/bash
          INPUT="$1"
          # Mengambil nama file saja tanpa path
          FILENAME=$(basename "$INPUT")
          # Menentukan nama output
          OUTPUT="compressed_videos/${FILENAME%.*}_H265.mp4"

          # Lewati jika sudah ada di cache
          if [ -f "$OUTPUT" ]; then
            echo "⏩ SKIPPED: $FILENAME sudah ada di Cache!"
            exit 0
          fi

          echo "🚀 Memulai kompresi: $FILENAME"
          
          ./ffmpeg.exe -nostdin -i "$INPUT" \
            -vf "setpts=N/(60*TB),hqdn3d=1.0:1.0:4:4,scale='if(gt(iw,ih),-2,720)':'if(gt(iw,ih),720,-2)':flags=spline+accurate_rnd+full_chroma_int+full_chroma_inp,colorspace=all=bt709:range=tv" \
            -af "aresample=async=1000" \
            -c:v libx265 -preset medium -crf 24 -r 60 -profile:v main -pix_fmt yuv420p \
            -g 120 -keyint_min 30 \
            -x265-params "ref=5:bframes=5:aq-mode=2:aq-strength=1.0:qg-size=16:psy-rd=1.0:psy-rdoq=1.0:rdoq-level=2:deblock=-1,-1:rc-lookahead=40:me=hex:merange=24:subme=5:wpp=1:pmode=1:pme=1:frame-threads=0:lookahead-threads=4:no-sao=1:colorprim=bt709:transfer=bt709:colormatrix=bt709:range=limited" \
            -tag:v hvc1 \
            -sws_flags spline+accurate_rnd \
            -c:a libfdk_aac -profile:a aac_he -b:a 64k \
            -video_track_timescale 60000 -metadata title="TikTok 8Bit Safe Color H265" \
            -movflags +faststart -y "$OUTPUT"
            
          echo "✅ Selesai: $FILENAME"
          EOF
          
          # Berikan izin agar script bisa dieksekusi
          chmod +x compress_single.sh

          echo "=================================================="
          echo "Memulai Batch Compression Paralel..."
          echo "=================================================="

          # Cari semua file MP4 di folder raw_videos, lalu lempar ke xargs
          # -n 1 artinya satu file per tugas
          # -P 3 artinya jalankan maksimal 3 tugas secara bersamaan (karena runner GitHub punya 4 CPU, kita sisakan 1 buat sistem)
          find raw_videos -type f -name "*.mp4" | xargs -n 1 -P 3 ./compress_single.sh
          
          echo "🎉 Semua video berhasil dikompresi!"

      - name: Upload Artifact (Otomatis ZIP Langsung)
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Batch-Windows-H265
          path: compressed_videos/
          retention-days: 7
