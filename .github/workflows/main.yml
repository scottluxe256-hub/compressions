name: Compress H265 Single File (Windows)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mega_url:
        description: 'URL File MEGA (Direct File Link)'
        required: false
        default: 'https://mega.nz/file/OvwlgLQD#XUSvtWK92GAO_mERU00Y0iAu4LcRLyv4JYd6Nfnm2z4'
      ffmpeg_url:
        description: 'URL Direct Download ffmpeg.exe'
        required: false

env:
  DEFAULT_FFMPEG_URL: 'https://github.com/scottluxe256-hub/compressions/releases/download/9.0.1/ffmpeg.exe'
  DEFAULT_MEGA_URL: 'https://mega.nz/file/OvwlgLQD#XUSvtWK92GAO_mERU00Y0iAu4LcRLyv4JYd6Nfnm2z4'

jobs:
  compress-h265:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Megatools via Chocolatey
        run: |
          choco install megatools -y
          mkdir -p raw_videos
          mkdir -p compressed_videos

      - name: Download Custom ffmpeg.exe
        run: |
          URL="${{ github.event.inputs.ffmpeg_url }}"
          if [ -z "$URL" ]; then
            URL="${{ env.DEFAULT_FFMPEG_URL }}"
          fi
          curl -L "$URL" -o ffmpeg.exe

      - name: Download File dari MEGA
        run: |
          MEGA_LINK="${{ github.event.inputs.mega_url }}"
          if [ -z "$MEGA_LINK" ]; then
            MEGA_LINK="${{ env.DEFAULT_MEGA_URL }}"
          fi

          # Konversi /file/ID#KEY menjadi /#!ID!KEY dengan benar
          OLD_MEGA_LINK=$(echo "$MEGA_LINK" | sed -E 's|/file/([^#]+)#|/#!\1!|')

          echo "Mengunduh dari: $OLD_MEGA_LINK"

          # Jalankan megatools, jika gagal otomatis download via Python
          megatools dl "$OLD_MEGA_LINK" --path raw_videos || {
            echo "⚠️ Megatools gagal, mencoba fallback via Python mega.py..."
            pip install mega.py
            python -c "from mega import Mega; m = Mega().login(); m.download_url('$OLD_MEGA_LINK', dest_path='raw_videos')"
          }

          echo "Isi folder raw_videos:"
          ls -la raw_videos

      - name: Proses Kompresi H.265
        run: |
          INPUT=$(find raw_videos -type f | head -n 1)

          if [ -z "$INPUT" ]; then
            echo "❌ Tidak ada video yang ditemukan!"
            exit 1
          fi

          FILENAME=$(basename "$INPUT")
          OUTPUT="compressed_videos/${FILENAME%.*}_H265_SuperClean.mp4"

          echo "🚀 Memproses kompresi H.265: $FILENAME"

          ./ffmpeg.exe -nostdin \
          -color_range pc -colorspace bt709 -color_primaries bt709 -color_trc bt709 \
          -i "$INPUT" \
          -r 60 \
          -c:v libx265 -preset slow -crf 26 -profile:v main -pix_fmt yuv420p \
          -g 120 -keyint_min 30 \
          -x265-params "level-idc=4.1:ref=5:bframes=5:aq-mode=3:aq-strength=0.9:qg-size=16:psy-rd=1.6:psy-rdoq=1.0:rdoq-level=2:deblock=-1,-1:rc-lookahead=60:me=umh:merange=24:subme=4:wpp=1:no-sao=1:colorprim=bt709:transfer=bt709:colormatrix=bt709:range=full" \
          -sws_flags spline+accurate_rnd \
          -vf "setpts=N/FRAME_RATE/TB,tmix=frames=3:weights='1 4 1',scale='if(gt(iw,ih),-2,720)':'if(gt(iw,ih),720,-2)':flags=spline+accurate_rnd+full_chroma_int+full_chroma_inp,colorspace=all=bt709:range=pc:irange=tv" \
          -c:a copy \
          -shortest \
          -video_track_timescale 60000 -tag:v hvc1 \
          -metadata title="TikTok 8Bit Safe Color H265 PC Range" \
          -movflags +faststart -y "$OUTPUT"


          echo "✅ Selesai: $OUTPUT"
          ls -lh compressed_videos/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Kompres-H265
          path: compressed_videos/
          retention-days: 7
