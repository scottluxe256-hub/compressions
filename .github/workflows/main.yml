name: Compress H265 Batch (Windows + MEGA)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mega_url:
        description: 'URL Folder MEGA'
        required: false
        default: 'https://mega.nz/folder/7jYB2CAJ#fbMvsXBK7sRV1wv_X6C57Q'
      ffmpeg_url:
        description: 'URL Direct Download ffmpeg.exe'
        required: false

env:
  DEFAULT_FFMPEG_URL: 'https://github.com/scottluxe256-hub/compressions/releases/download/9.0.1/ffmpeg.exe'
  DEFAULT_MEGA_URL: 'https://mega.nz/folder/7jYB2CAJ#fbMvsXBK7sRV1wv_X6C57Q'

jobs:
  compress-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Megatools via Chocolatey
        run: |
          choco install megatools -y
          mkdir -p raw_videos
          mkdir -p compressed_videos

      - name: Download Custom ffmpeg.exe
        run: |
          URL="${{ github.event.inputs.ffmpeg_url }}"
          if [ -z "$URL" ]; then
            URL="${{ env.DEFAULT_FFMPEG_URL }}"
          fi
          curl -L "$URL" -o ffmpeg.exe

      - name: Download Folder dari MEGA
        run: |
          MEGA_LINK="${{ github.event.inputs.mega_url }}"
          if [ -z "$MEGA_LINK" ]; then
            MEGA_LINK="${{ env.DEFAULT_MEGA_URL }}"
          fi
          megatools dl "$MEGA_LINK" --path raw_videos/

      - name: Proses Kompresi H.265
        run: |
          shopt -s globstar nullglob
          
          # Cari semua file video di folder raw_videos secara rekursif
          find raw_videos -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.mov" \) | while read -r INPUT; do
            FILENAME=$(basename "$INPUT")
            OUTPUT="compressed_videos/${FILENAME%.*}_H265_Clean.mp4"

            echo "🚀 Memproses kompresi H.265: $FILENAME"

            ./ffmpeg.exe -nostdin \
              -colorspace bt709 -color_primaries bt709 -color_trc bt709 \
              -i "$INPUT" \
              -c:v libx265 -preset slow -crf 26 -r 60 -profile:v main -pix_fmt yuv420p \
              -g 120 -keyint_min 30 \
              -x265-params "ref=5:bframes=5:aq-mode=2:aq-strength=0.8:qg-size=16:psy-rd=0.4:psy-rdoq=0.15:rdoq-level=2:deblock=1,1:rc-lookahead=60:me=umh:merange=24:subme=3:wpp=1:sao=1:colorprim=bt709:transfer=bt709:colormatrix=bt709:range=limited" \
              -sws_flags spline+accurate_rnd \
              -vf "setpts=N/(60*TB),hqdn3d=1.0:1.0:4:4,scale='if(gt(iw,ih),-2,720)':'if(gt(iw,ih),720,-2)':flags=spline+accurate_rnd+full_chroma_int+full_chroma_inp,colorspace=all=bt709:range=tv" \
              -c:a libfdk_aac -profile:a aac_he -b:a 64k \
              -af "aresample=async=1000,apad" \
              -video_track_timescale 60000 -tag:v hvc1 \
              -metadata title="TikTok 8Bit Safe Color H265" \
              -movflags +faststart -shortest -y "$OUTPUT"

            echo "✅ Selesai: $OUTPUT"
          done

          echo "🎉 Semua video berhasil dikompres!"
          ls -lh compressed_videos/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Kompres-H265-Batch
          path: compressed_videos/
          retention-days: 7
