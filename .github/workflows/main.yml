name: Matrix Compress H265 (Windows + MEGA)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mega_url:
        description: 'URL Direct MEGA Folder'
        required: false
        default: 'https://mega.nz/folder/7jYB2CAJ#fbMvsXBK7sRV1wv_X6C57Q'
      ffmpeg_url:
        description: 'URL Direct Download ffmpeg.exe'
        required: false

env:
  DEFAULT_FFMPEG_URL: 'https://github.com/scottluxe256-hub/compressions/releases/download/9.0.1/ffmpeg.exe'
  DEFAULT_MEGA_URL: 'https://mega.nz/folder/7jYB2CAJ#fbMvsXBK7sRV1wv_X6C57Q'

jobs:
  matrix-compress-windows:
    runs-on: windows-latest
    strategy:
      # Jalankan maksimal 2 mesin bersamaan kalau ada kendala limitasi dari GitHub
      max-parallel: 2 
      matrix:
        # Karena cuma ada 2 video, kita belah jadi 2 mesin. 
        # Kalau nanti videonya ada 27, kamu bisa ubah jadi [1, 2, 3, 4, 5]
        bucket: [1, 2] 
      fail-fast: false # Kalau mesin 1 gagal, mesin 2 tetap lanjut jalan

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Megatools via Chocolatey
        run: |
          choco install megatools -y
          mkdir -p raw_videos

      - name: Download Custom ffmpeg.exe
        run: |
          URL="${{ github.event.inputs.ffmpeg_url }}"
          if [ -z "$URL" ]; then
            URL="${{ env.DEFAULT_FFMPEG_URL }}"
          fi
          curl -L "$URL" -o ffmpeg.exe

      - name: Restore Cache (Spesifik per Mesin)
        uses: actions/cache@v4
        with:
          path: compressed_videos
          # Cache dipisah per mesin (bucket) dan di-reset (v3) agar file 0 byte dari error sebelumnya tidak dipanggil lagi
          key: matrix-cache-v3-bucket${{ matrix.bucket }}-${{ runner.os }}-${{ hashFiles('raw_videos/**') }}
          restore-keys: |
            matrix-cache-v3-bucket${{ matrix.bucket }}-${{ runner.os }}-

      - name: Download Video dari MEGA
        run: |
          MEGA_LINK="${{ github.event.inputs.mega_url }}"
          if [ -z "$MEGA_LINK" ]; then
            MEGA_LINK="${{ env.DEFAULT_MEGA_URL }}"
          fi
          megatools dl "$MEGA_LINK" --path raw_videos/

      - name: Proses Kompresi Jatah Mesin ${{ matrix.bucket }}
        run: |
          mkdir -p compressed_videos
          
          BUCKET=${{ matrix.bucket }}
          # Pastikan angka ini SAMA dengan jumlah array di matrix kamu
          TOTAL_BUCKETS=2 
          
          echo "=================================================="
          echo "🤖 Ini adalah Mesin Worker $BUCKET dari $TOTAL_BUCKETS"
          echo "=================================================="

          # Memasukkan semua file MP4 ke dalam array Bash secara aman (mendukung nama file pakai spasi)
          mapfile -d $'\0' FILES < <(find raw_videos -type f -name "*.mp4" -print0 | sort -z)
          
          # Looping file dan bagi-bagi tugas berdasarkan hitungan matematika (modulus)
          for i in "${!FILES[@]}"; do
            # Logika pembagian: Index file sisa bagi jumlah mesin = ID mesin (dikurang 1 karena index mulai dari 0)
            if (( i % TOTAL_BUCKETS == (BUCKET - 1) )); then
              INPUT="${FILES[$i]}"
              FILENAME=$(basename "$INPUT")
              OUTPUT="compressed_videos/${FILENAME%.*}_H265.mp4"

              if [ -s "$OUTPUT" ]; then
                echo "⏩ SKIPPED: $FILENAME sudah ada di Cache!"
                continue # Lanjut ke video berikutnya
              fi

              echo "🚀 Mesin $BUCKET Memproses: $FILENAME"
              
              # Filter 'colorspace' dihapus agar tidak error 'Unsupported input transfer'
              ./ffmpeg.exe -nostdin -i "$INPUT" \
                -vf "setpts=N/(60*TB),hqdn3d=1.0:1.0:4:4,scale='if(gt(iw,ih),-2,720)':'if(gt(iw,ih),720,-2)':flags=spline+accurate_rnd+full_chroma_int+full_chroma_inp" \
                -af "aresample=async=1000" \
                -c:v libx265 -preset medium -crf 24 -r 60 -profile:v main -pix_fmt yuv420p \
                -g 120 -keyint_min 30 \
                -x265-params "ref=5:bframes=5:aq-mode=2:aq-strength=1.0:qg-size=16:psy-rd=1.0:psy-rdoq=1.0:rdoq-level=2:deblock=-1,-1:rc-lookahead=40:me=hex:merange=24:subme=5:wpp=1:pmode=1:pme=1:frame-threads=0:lookahead-threads=4:no-sao=1:colorprim=bt709:transfer=bt709:colormatrix=bt709:range=limited" \
                -tag:v hvc1 \
                -sws_flags spline+accurate_rnd \
                -c:a libfdk_aac -profile:a aac_he -b:a 64k \
                -video_track_timescale 60000 -metadata title="TikTok 8Bit Safe Color H265" \
                -movflags +faststart -y "$OUTPUT"
                
              echo "✅ Mesin $BUCKET Selesai: $FILENAME"
            fi
          done
          
          echo "=== Hasil di Mesin $BUCKET ==="
          ls -lh compressed_videos/ || echo "Tidak ada file yang diproses."

      - name: Upload Artifact Mesin ${{ matrix.bucket }}
        uses: actions/upload-artifact@v4
        with:
          # Nama artifact dibedakan per mesin agar tidak bentrok
          name: Hasil-Kompres-Part-${{ matrix.bucket }}
          path: compressed_videos/
          retention-days: 7
