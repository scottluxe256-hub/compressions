name: Concat & Compress H265 (Windows + MEGA)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mega_url:
        description: 'URL Direct MEGA Folder (Berisi video_1.mp4 & video_2.mp4)'
        required: false
        default: 'https://mega.nz/folder/P6JElAxI#fbMvsXBK7sRV1wv_X6C57Q'
      ffmpeg_url:
        description: 'URL Direct Download ffmpeg.exe Custom Kamu'
        required: false

env:
  DEFAULT_FFMPEG_URL: 'https://github.com/scottluxe256-hub/compressions/releases/download/9.0.1/ffmpeg.exe'
  DEFAULT_MEGA_URL: 'https://mega.nz/folder/P6JElAxI#fbMvsXBK7sRV1wv_X6C57Q'

jobs:
  concat-compress-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Megatools via Chocolatey
        run: |
          choco install megatools -y
          mkdir -p raw_videos

      - name: Download Custom ffmpeg.exe
        run: |
          URL="${{ github.event.inputs.ffmpeg_url }}"
          if [ -z "$URL" ]; then
            URL="${{ env.DEFAULT_FFMPEG_URL }}"
          fi

          echo "Mengunduh ffmpeg.exe kustom dari: $URL"
          curl -L "$URL" -o ffmpeg.exe

      - name: Restore Cache Folder Compressed Videos
        uses: actions/cache@v4
        with:
          path: compressed_videos
          key: concat-cache-${{ runner.os }}-${{ hashFiles('raw_videos/**') }}
          restore-keys: |
            concat-cache-${{ runner.os }}-

      - name: Download Video dari MEGA
        run: |
          MEGA_LINK="${{ github.event.inputs.mega_url }}"
          if [ -z "$MEGA_LINK" ]; then
            MEGA_LINK="${{ env.DEFAULT_MEGA_URL }}"
          fi

          echo "Mengunduh file/folder dari MEGA: $MEGA_LINK"
          megatools dl "$MEGA_LINK" --path raw_videos/
          
          echo "=== Cek isi folder raw_videos setelah download ==="
          find raw_videos -type f

      - name: Proses Concat & Kompresi H265 (CRF 26)
        run: |
          mkdir -p compressed_videos
          
          # Gunakan 'find' sebagai radar untuk mencari lokasi persis file
          V1=$(find raw_videos -type f -name "video_1.mp4" | head -n 1)
          V2=$(find raw_videos -type f -name "video_2.mp4" | head -n 1)
          OUTPUT="compressed_videos/hasil_concat_H265.mp4"

          # Validasi apakah file yang dibutuhkan beneran ada
          if [ -z "$V1" ] || [ -z "$V2" ]; then
            echo "❌ Gagal: video_1.mp4 atau video_2.mp4 tidak ditemukan di dalam folder hasil download MEGA!"
            exit 1
          fi

          if [ -f "$OUTPUT" ]; then
            echo "⏩ SKIPPED: hasil_concat_H265.mp4 sudah ada di Cache!"
            exit 0
          fi

          echo "=================================================="
          echo "Memproses Concat: $V1 + ($V2 yang dipotong awalannya)"
          echo "=================================================="

          ./ffmpeg.exe -nostdin \
            -i "$V1" \
            -i "$V2" \
            -filter_complex \
            "[0:v]setpts=N/(60*TB),hqdn3d=1.0:1.0:4:4,scale='if(gt(iw,ih),-2,720)':'if(gt(iw,ih),720,-2)':flags=spline+accurate_rnd+full_chroma_int+full_chroma_inp,colorspace=all=bt709:range=tv[v1]; \
             [0:a]aresample=async=1000,apad[a1]; \
             [1:v]trim=start=28.9,setpts=N/(60*TB),hqdn3d=1.0:1.0:4:4,scale='if(gt(iw,ih),-2,720)':'if(gt(iw,ih),720,-2)':flags=spline+accurate_rnd+full_chroma_int+full_chroma_inp,colorspace=all=bt709:range=tv[v2]; \
             [1:a]atrim=start=28.9,asetpts=PTS-STARTPTS,aresample=async=1000,apad[a2]; \
             [v1][a1][v2][a2]concat=n=2:v=1:a=1[vout][aout]" \
            -map "[vout]" -map "[aout]" \
            -c:v libx265 -preset slow -crf 26 -r 60 -profile:v main -pix_fmt yuv420p \
            -g 120 -keyint_min 30 \
            -x265-params "ref=6:bframes=6:aq-mode=2:aq-strength=1.0:qg-size=16:psy-rd=1.0:psy-rdoq=1.0:rdoq-level=2:deblock=-1,-1:rc-lookahead=60:me=umh:merange=24:subme=5:wpp=1:pmode=1:pme=1:frame-threads=0:lookahead-threads=4:no-sao=1:colorprim=bt709:transfer=bt709:colormatrix=bt709:range=limited" \
            -tag:v hvc1 \
            -sws_flags spline+accurate_rnd \
            -c:a libfdk_aac -profile:a aac_he -b:a 64k \
            -video_track_timescale 60000 -metadata title="TikTok 8Bit Safe Color Concat H265" \
            -movflags +faststart -y "$OUTPUT"
          
          echo "✅ Selesai memproses concat video!"

      - name: Upload Artifact (Otomatis ZIP Langsung)
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Concat-Windows-H265
          path: compressed_videos/
          retention-days: 7
