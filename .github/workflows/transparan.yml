name: Compress Mascot Atlas H265 (Ubuntu)

on:
  workflow_dispatch:
    inputs:
      mega_folder_url:
        description: 'URL Folder MEGA (berisi hair-front.mp4, hair-back.mp4, eyes-blink.mp4)'
        required: true
      resolution:
        description: 'Lebar per Panel (640 = 1920x1136 / 2.18MP | 576 = 1728x1024 / 1.77MP)'
        required: true
        default: '640'
        type: choice
        options:
          - '576'
          - '640'
      ffmpeg_url:
        description: 'URL Direct Download ffmpeg binary (opsional)'
        required: false

env:
  DEFAULT_FFMPEG_URL: 'https://github.com/scottluxe256-hub/compressions/releases/download/9.0.2/ffmpeg'

jobs:
  compress-mascot-atlas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Folders & Install Tools
        run: |
          mkdir -p raw_videos compressed_videos
          sudo apt-get update
          sudo apt-get install -y megatools

      - name: Download Custom Linux ffmpeg
        run: |
          URL="${{ github.event.inputs.ffmpeg_url }}"
          if [ -z "$URL" ]; then
            URL="${{ env.DEFAULT_FFMPEG_URL }}"
          fi
          echo "Downloading FFmpeg from: $URL"
          curl -L "$URL" -o ffmpeg
          chmod +x ffmpeg

      - name: Download Folder dari MEGA
        run: |
          MEGA_LINK="${{ github.event.inputs.mega_folder_url }}"
          OLD_MEGA_LINK=$(echo "$MEGA_LINK" | sed -E 's|/folder/([^#]+)#|/#F!\1!|; s|/file/([^#]+)#|/#!\1!|')

          echo "Mengunduh folder dari: $OLD_MEGA_LINK"
          megatools dl "$OLD_MEGA_LINK" --path raw_videos

          echo "Isi folder raw_videos:"
          find raw_videos -type f -exec ls -lh {} +

      - name: Gabung & Kompres Mascot Atlas H.265 (Clean Native Timing + Mata 0s & 8s)
        run: |
          HAIR_FRONT=$(find raw_videos -type f -iname "hair-front.*" | head -n 1)
          HAIR_BACK=$(find raw_videos -type f -iname "hair-back.*" | head -n 1)
          EYES_BLINK=$(find raw_videos -type f -iname "eyes-blink.*" | head -n 1)

          if [ -z "$HAIR_FRONT" ] || [ -z "$HAIR_BACK" ] || [ -z "$EYES_BLINK" ]; then
            echo "❌ Salah satu file (hair-front, hair-back, eyes-blink) tidak ditemukan di folder MEGA!"
            exit 1
          fi

          RES="${{ github.event.inputs.resolution }}"
          if [ -z "$RES" ]; then
            RES="640"
          fi

          PANEL_W="$RES"
          PANEL_H=$(( (RES * 16 / 9) / 2 * 2 ))
          OUTPUT="compressed_videos/mascot-atlas_${RES}p_H265.mp4"

          echo "🚀 Memproses Atlas H.265 (${PANEL_W}x${PANEL_H} per panel -> total $((PANEL_W * 3))x${PANEL_H})"

          ./ffmpeg -nostdin \
          -i "$HAIR_FRONT" \
          -i "$HAIR_BACK" \
          -i "$EYES_BLINK" \
          -filter_complex "\
          [0:v]scale=${PANEL_W}:${PANEL_H}:flags=spline+accurate_rnd+full_chroma_int+full_chroma_inp[hf]; \
          [1:v]scale=${PANEL_W}:${PANEL_H}:flags=spline+accurate_rnd+full_chroma_int+full_chroma_inp[hb]; \
          [2:v]scale=${PANEL_W}:${PANEL_H}:flags=spline+accurate_rnd+full_chroma_int+full_chroma_inp,tpad=stop_mode=clone:stop_duration=6,trim=duration=8,setpts=PTS-STARTPTS,split=2[eb1][eb2]; \
          [eb1][eb2]concat=n=2:v=1:a=0[eb]; \
          [hf][hb][eb]hstack=inputs=3:shortest=1[out]" \
          -map "[out]" \
          -c:v libx265 -preset slower -crf 22 -pix_fmt yuv420p \
          -x265-params "no-open-gop=1:colorprim=bt709:transfer=bt709:colormatrix=bt709" \
          -colorspace bt709 -color_primaries bt709 -color_trc bt709 \
          -tag:v hvc1 -movflags +faststart -an -y "$OUTPUT"

          echo "✅ Selesai: $OUTPUT"
          ls -lh compressed_videos/

      - name: Upload MP4 Langsung ke MEGA
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          OUTPUT_FILE=$(find compressed_videos -name "*.mp4" | head -n 1)

          if [ -z "$OUTPUT_FILE" ]; then
            echo "❌ File output MP4 tidak ditemukan!"
            exit 1
          fi

          megamkdir -u "$MEGA_EMAIL" -p "$MEGA_PASSWORD" /Root/Hasil_Render_FFmpeg || true

          echo "☁️ Mengunggah $OUTPUT_FILE langsung ke MEGA..."
          megaput -u "$MEGA_EMAIL" -p "$MEGA_PASSWORD" --path /Root/Hasil_Render_FFmpeg "$OUTPUT_FILE"

          echo "✅ Selesai! File MP4 murni sudah masuk ke folder /Hasil_Render_FFmpeg di MEGA."
